name: Nive CI
on: [push, pull_request]
jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes && forge test -vvv
  python-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install pytest && pytest runtime/tests/ sdk/ -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff && ruff check runtime/ sdk/ bridge/ registry/ oracle/ cli/ scripts/
